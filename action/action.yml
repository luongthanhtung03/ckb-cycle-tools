name: CKB cycle report
description: >
  Replays the scenarios in a cycles.json with the binaries built from a pull
  request and from its base, and posts one sticky comment with the per-script
  cycle diff and any accept/reject change.
author: Luong Thanh Tung

inputs:
  config:
    description: Path to the cycles.json, relative to the repository root.
    default: cycles.json
  build:
    description: >
      Shell command that builds the binaries the config names. Runs twice: in the
      PR checkout and in a checkout of the base commit. Empty: nothing to build.
    default: ""
  base-ref:
    description: The commit to compare against. Empty on a push, which reports the head alone.
    default: ${{ github.event.pull_request.base.sha }}
  fail-above:
    description: Fail when a script group grows by more than this percentage. Empty never fails on growth.
    default: ""
  fail-on-result-change:
    description: Fail when a script group's result changed (ok to exit N, or back, or a different VM error).
    default: "false"
  allow-removed:
    description: >
      With fail-above or fail-on-result-change set, do not fail on base script groups
      with nothing in the head to compare against (a scenario or group the PR removed,
      renamed or moved, or one whose binary the base did not build).
    default: "false"
  comment:
    description: Post (or update) the sticky PR comment. The table also goes to the job summary either way.
    default: "true"
  title:
    description: Heading of the comment.
    default: Cycle report
  github-token:
    description: Token for the comment. Needs pull-requests write.
    default: ${{ github.token }}
  ckb-debugger-version:
    description: ckb-standalone-debugger release to install when ckb-debugger is not on PATH.
    default: v1.1.1
  ckb-debugger-sha256:
    description: >
      SHA-256 of that release's x86_64-unknown-linux-gnu tarball. Pinned for the
      default v1.1.1; required when ckb-debugger-version is changed.
    default: ""

outputs:
  report:
    description: Path to the head report (JSON).
    value: ${{ steps.diff.outputs.report }}
  markdown:
    description: Path to the markdown diff.
    value: ${{ steps.diff.outputs.markdown }}
  failed:
    description: >
      "true" when the diff failed the thresholds, a head scenario could not run, or (with
      a threshold set) a base scenario could not run, either report has errors, or a base
      group has nothing to compare against (unless allow-removed).
    value: ${{ steps.diff.outputs.failed }}

runs:
  using: composite
  steps:
    # Before the PR's build runs. What that build writes to $GITHUB_PATH or $GITHUB_ENV
    # applies to every later step of the job, so it must not decide which gh receives
    # the token or where gh sends it.
    - name: Resolve the comment's tools
      id: tools
      shell: bash
      run: |
        gh=$(command -v gh || true)
        case $gh in /*) ;; *) gh= ;; esac
        clean() { printf '%s' "${1//[$'\r\n']/}"; }
        {
          echo "gh=$gh"
          echo "https-proxy=$(clean "${HTTPS_PROXY:-${https_proxy:-}}")"
          echo "http-proxy=$(clean "${HTTP_PROXY:-${http_proxy:-}}")"
          echo "no-proxy=$(clean "${NO_PROXY:-${no_proxy:-}}")"
          echo "ssl-cert-file=$(clean "${SSL_CERT_FILE:-}")"
          echo "ssl-cert-dir=$(clean "${SSL_CERT_DIR:-}")"
        } >> "$GITHUB_OUTPUT"

    - name: Install ckb-debugger
      shell: bash
      env:
        VERSION: ${{ inputs.ckb-debugger-version }}
        SHA256: ${{ inputs.ckb-debugger-sha256 }}
      run: |
        if command -v ckb-debugger >/dev/null; then ckb-debugger --version; exit 0; fi
        if [ "$RUNNER_OS" != Linux ] || [ "$(uname -m)" != x86_64 ]; then
          echo "::error::install ckb-debugger yourself on $RUNNER_OS/$(uname -m), or use ubuntu-latest"
          exit 1
        fi
        # A release asset can be replaced under the same tag: run only the tarball that was checked.
        # v1.1.1's checksum is the one the release publishes (…-sha256.txt) and GitHub's asset digest.
        if [ -z "$SHA256" ] && [ "$VERSION" = v1.1.1 ]; then SHA256=0dee02804af46386527c8bb94c2ee63592594ca1ec952ea42ffa9df07a9f005e; fi
        if [ -z "$SHA256" ]; then
          echo "::error::ckb-debugger $VERSION: set ckb-debugger-sha256 to the SHA-256 of its x86_64-unknown-linux-gnu tarball"
          exit 1
        fi
        url="https://github.com/nervosnetwork/ckb-standalone-debugger/releases/download/${VERSION}/ckb-debugger_${VERSION}_x86_64-unknown-linux-gnu.tar.gz"
        curl -fsSL "$url" -o "$RUNNER_TEMP/ckb-debugger.tar.gz"
        echo "$SHA256  $RUNNER_TEMP/ckb-debugger.tar.gz" | sha256sum -c -
        mkdir -p "$HOME/.ckb-tools"
        tar -xzf "$RUNNER_TEMP/ckb-debugger.tar.gz" -C "$HOME/.ckb-tools"
        echo "$HOME/.ckb-tools" >> "$GITHUB_PATH"
        "$HOME/.ckb-tools/ckb-debugger" --version

    - name: Build ckb-cycles
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: |
        node -e 'if (+process.versions.node.split(".")[0] < 20) { console.error("::error::ckb-cycles needs Node 20 or later"); process.exit(1) }'
        npm ci --workspaces=false --no-audit --no-fund
        npm run build
        echo "CKB_CYCLES=$PWD/dist/cli.js" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/ckb-cycles"

    - name: Report the head
      shell: bash
      env:
        BUILD: ${{ inputs.build }}
        CONFIG: ${{ inputs.config }}
      run: |
        if [ -n "$BUILD" ]; then bash -euo pipefail -c "$BUILD"; fi
        # A scenario that cannot run is in the report as an error row; the diff fails on it.
        # The report's other errors (a binary no scenario uses) are in the JSON too, and a
        # gated diff fails on them: hence `|| true`, the verdict is the diff's.
        # --root: the cycles.json is the PR's; it reads nothing outside the checkout.
        node "$CKB_CYCLES" report "$CONFIG" --root "$GITHUB_WORKSPACE" --json "$RUNNER_TEMP/ckb-cycles/head.json" || true

    - name: Report the base
      shell: bash
      env:
        BUILD: ${{ inputs.build }}
        CONFIG: ${{ inputs.config }}
        BASE: ${{ inputs.base-ref }}
      run: |
        out="$RUNNER_TEMP/ckb-cycles"
        if [ -z "$BASE" ]; then
          echo '{"tool":"ckb-cycles","version":1,"scenarios":[]}' > "$out/base.json"
          exit 0
        fi
        # Already there with fetch-depth: 0, which a private repository checked out with
        # persist-credentials: false needs (the fetch has no credentials then).
        if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then git fetch --no-tags --depth=1 origin "$BASE"; fi
        git worktree add --detach "$out/base" "$BASE"
        # The base is measured by the base commit's own cycles.json, mocks and binaries,
        # not the PR's: a scenario or group the PR deletes, renames or moves is then a
        # base group with nothing to compare against, which a gated diff fails on (the
        # allow-removed input accepts it). The head's scenarios still run with the PR's
        # config, as before.
        if [ ! -f "$out/base/$CONFIG" ]; then
          # No cycles.json on the base (the PR adds it): every head group is new.
          echo '{"tool":"ckb-cycles","version":1,"scenarios":[]}' > "$out/base.json"
        elif [ -n "$BUILD" ] && ! (cd "$out/base" && bash -euo pipefail -c "$BUILD"); then
          # A base whose build fails has nothing to compare: every scenario is recorded as
          # a base error, which the diff reports and fails on when a threshold is set.
          echo "::warning::the build failed on the base commit"
          node -e '
            const [config, head, out] = process.argv.slice(1);
            const fs = require("fs");
            const names = (file, pick) => { try { return pick(JSON.parse(fs.readFileSync(file, "utf8"))).map((s) => String(s.name)); } catch { return []; } };
            const all = [...new Set([...names(config, (c) => c.scenarios), ...names(head, (r) => r.scenarios)])];
            const scenarios = all.map((name) => ({ name, error: "the build failed on the base commit", groups: [] }));
            fs.writeFileSync(out, JSON.stringify({ tool: "ckb-cycles", version: 1, scenarios }));
          ' "$out/base/$CONFIG" "$out/head.json" "$out/base.json"
        else
          # Its errors (a binary no scenario uses) are in the JSON, and a gated diff fails on them.
          # --root: the base's config reads nothing outside the base checkout.
          node "$CKB_CYCLES" report "$out/base/$CONFIG" --root "$out/base" --json "$out/base.json" || true
          if [ ! -s "$out/base.json" ]; then
            echo '{"tool":"ckb-cycles","version":1,"scenarios":[],"errors":["the base report did not run (see the log): nothing on the base was measured"]}' > "$out/base.json"
          fi
        fi
        git worktree remove --force "$out/base"

    - name: Diff
      id: diff
      shell: bash
      env:
        BASE: ${{ inputs.base-ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        FAIL_ABOVE: ${{ inputs.fail-above }}
        FAIL_ON_RESULT_CHANGE: ${{ inputs.fail-on-result-change }}
        ALLOW_REMOVED: ${{ inputs.allow-removed }}
        TITLE: ${{ inputs.title }}
      run: |
        out="$RUNNER_TEMP/ckb-cycles"
        args=(--markdown --title "$TITLE" --head-label "${HEAD_SHA:0:7}")
        if [ -n "$BASE" ]; then args+=(--base-label "${BASE:0:7}"); else args+=(--base-label "none"); fi
        if [ -n "$FAIL_ABOVE" ]; then args+=(--fail-above "$FAIL_ABOVE"); fi
        if [ "$FAIL_ON_RESULT_CHANGE" = true ]; then args+=(--fail-on-result-change); fi
        if [ "$ALLOW_REMOVED" = true ]; then args+=(--allow-removed); fi
        set +e
        node "$CKB_CYCLES" diff "$out/base.json" "$out/head.json" "${args[@]}" > "$out/diff.md"
        code=$?
        set -e
        # 0 and 1 are verdicts; anything else (2: bad arguments or reports), or no output,
        # is the diff itself failing.
        if [ "$code" -gt 1 ] || [ ! -s "$out/diff.md" ]; then cat "$out/diff.md"; exit 2; fi
        # Only a diff that ran is the comment (a second job may post this file).
        mv "$out/diff.md" "$out/comment.md"
        cat "$out/comment.md" >> "$GITHUB_STEP_SUMMARY"
        {
          echo "report=$out/head.json"
          echo "markdown=$out/comment.md"
          echo "failed=$([ "$code" = 1 ] && echo true || echo false)"
        } >> "$GITHUB_OUTPUT"

    # The PR's build ran earlier in this job and may have written $GITHUB_ENV and
    # $GITHUB_PATH. So: bash by absolute path (`shell: bash` is looked up on PATH), -p (no
    # BASH_ENV or ENV file, no functions from the environment), the step's env (which wins
    # over $GITHUB_ENV) blanks what the dynamic loader reads, PATH is set in the
    # script (the runner puts $GITHUB_PATH in front of a step's PATH), and gh, resolved
    # before the build, runs with only the variables it needs. This cannot stop a build
    # that left a process running or replaced files on the runner: for a PR you do not
    # trust, post from a second job (action/README.md, "Security").
    - name: Post the sticky comment
      if: inputs.comment == 'true' && github.event.pull_request.number
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH: ${{ steps.tools.outputs.gh }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        BODY: ${{ runner.temp }}/ckb-cycles/comment.md
        RETRY_DELAY: "5"
        PROXY_HTTPS: ${{ steps.tools.outputs.https-proxy }}
        PROXY_HTTP: ${{ steps.tools.outputs.http-proxy }}
        PROXY_NO: ${{ steps.tools.outputs.no-proxy }}
        CERT_FILE: ${{ steps.tools.outputs.ssl-cert-file }}
        CERT_DIR: ${{ steps.tools.outputs.ssl-cert-dir }}
        BASH_ENV: ""
        ENV: ""
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
      run: |
        export PATH=/usr/bin:/bin
        if [ -z "$GH" ]; then echo "::warning::gh is not on PATH; the report is in the job summary"; exit 0; fi
        case $PR in '' | *[!0-9]*) echo "::warning::no pull request number; the report is in the job summary"; exit 0 ;; esac
        if [ ! -f "$BODY" ] || [ -L "$BODY" ]; then echo "::warning::no report at $BODY; nothing to post"; exit 0; fi
        case $RETRY_DELAY in '' | *[!0-9]*) RETRY_DELAY=5 ;; esac
        # gh gets these variables and nothing else from the job, and an empty config directory.
        cfg=$(mktemp -d /tmp/ckb-gh.XXXXXXXX)
        trap 'rm -rf "$cfg"' EXIT
        gh() {
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$cfg" GH_CONFIG_DIR="$cfg" GH_TOKEN="$GH_TOKEN" \
            GH_PROMPT_DISABLED=1 GH_NO_UPDATE_NOTIFIER=1 \
            HTTPS_PROXY="$PROXY_HTTPS" https_proxy="$PROXY_HTTPS" HTTP_PROXY="$PROXY_HTTP" http_proxy="$PROXY_HTTP" \
            NO_PROXY="$PROXY_NO" no_proxy="$PROXY_NO" SSL_CERT_FILE="$CERT_FILE" SSL_CERT_DIR="$CERT_DIR" \
            "$GH" "$@"
        }
        marker='<!-- ckb-cycles-report -->'
        # Only a comment this token posted is ours to update: anyone can write one that
        # starts with the marker. The workflow token cannot read /user; it is the bot.
        login=$(gh api user --jq .login 2>/dev/null) || login='github-actions[bot]'
        # All the matches first, then the first of them: `| head` could cut gh off mid-page.
        ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq ".[] | select(.user.login == \"$login\" and (.body | startswith(\"$marker\"))) | .id") || {
          # Unknown whether ours exists: posting now could put a second one beside it.
          echo "::warning::could not list the pull request's comments; the report is in the job summary"
          exit 0
        }
        id=${ids%%$'\n'*}
        # A pull request from a fork gets a read-only token: the summary still has the table.
        if [ -z "$id" ]; then
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$BODY" >/dev/null \
            || echo "::warning::could not post the cycle report comment (read-only token?)"
          exit 0
        fi
        # Our comment exists: update it, retrying, and never post a second one beside it.
        for try in 1 2 3; do
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$BODY" >/dev/null && exit 0
          [ "$try" = 3 ] || sleep $((try * RETRY_DELAY))
        done
        echo "::warning::could not update the cycle report comment $id (read-only token?)"

    - name: Fail on the thresholds
      if: steps.diff.outputs.failed == 'true'
      shell: bash
      run: |
        echo "::error::cycle report: a threshold was crossed or a scenario could not run (see the job summary)"
        exit 1
