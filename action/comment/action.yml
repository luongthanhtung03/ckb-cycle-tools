name: CKB cycle report comment
description: >
  Posts or updates the sticky cycle-report comment on a pull request from the
  markdown the main Action wrote. For a second job that runs no pull-request
  code, so the token that can comment never shares a runner with the PR's build.
author: Luong Thanh Tung

inputs:
  markdown:
    description: >
      Path to the markdown file: the main Action's `markdown` output, downloaded
      from the first job. Must be a regular file (not a symlink).
    required: true
  pr:
    description: >
      Number of the pull request to comment on. Empty under workflow_run (whose
      event has no pull request for one from a fork): it is found from head-sha.
    default: ${{ github.event.pull_request.number }}
  head-sha:
    description: >
      The commit the report measured. When set, the comment is posted only on an open
      pull request of this repository whose head is still that commit: one that has
      moved on gets the next run's report instead. Under workflow_run, the run's
      head_sha (from the event, not from the artifact).
    default: ${{ github.event.workflow_run.head_sha }}
  head-owner:
    description: Owner of the pull request's head repository (the fork), to find it from head-sha.
    default: ${{ github.event.workflow_run.head_repository.owner.login }}
  head-branch:
    description: The pull request's head branch, to find it from head-sha.
    default: ${{ github.event.workflow_run.head_branch }}
  max-bytes:
    description: >
      The largest markdown file posted, in bytes (at most 262144). The report keeps
      itself under 60,000 characters (GitHub refuses a comment over 65,536); this
      bounds what a hostile artifact can make the job read. A larger one is not posted.
    default: "262144"
  github-token:
    description: Token for the comment. Needs pull-requests write.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Resolve the comment's tools
      id: tools
      shell: bash
      run: |
        gh=$(command -v gh || true)
        case $gh in /*) ;; *) gh= ;; esac
        clean() { printf '%s' "${1//[$'\r\n']/}"; }
        {
          echo "gh=$gh"
          echo "https-proxy=$(clean "${HTTPS_PROXY:-${https_proxy:-}}")"
          echo "http-proxy=$(clean "${HTTP_PROXY:-${http_proxy:-}}")"
          echo "no-proxy=$(clean "${NO_PROXY:-${no_proxy:-}}")"
          echo "ssl-cert-file=$(clean "${SSL_CERT_FILE:-}")"
          echo "ssl-cert-dir=$(clean "${SSL_CERT_DIR:-}")"
        } >> "$GITHUB_OUTPUT"

    # No pull-request code runs in this job, but the steps before this one in it could
    # have written $GITHUB_ENV or $GITHUB_PATH: the same precautions as in the main Action.
    # The markdown was written by a job the pull request's code ran in (under
    # pull_request a PR can change the workflow too): it is data, checked here and
    # never run. It must look like a report (the marker on its first line, no NUL
    # bytes, at most max-bytes), and a copy with every @mention and #ref broken by a
    # zero-width space (as the report itself writes them) is what gets posted.
    # Which PR it goes to comes from the event and the API, never from the artifact.
    - name: Check the report and the pull request
      id: check
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH: ${{ steps.tools.outputs.gh }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.pr }}
        HEAD_SHA: ${{ inputs.head-sha }}
        HEAD_OWNER: ${{ inputs.head-owner }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
        MARKDOWN: ${{ inputs.markdown }}
        MAX_BYTES: ${{ inputs.max-bytes }}
        PROXY_HTTPS: ${{ steps.tools.outputs.https-proxy }}
        PROXY_HTTP: ${{ steps.tools.outputs.http-proxy }}
        PROXY_NO: ${{ steps.tools.outputs.no-proxy }}
        CERT_FILE: ${{ steps.tools.outputs.ssl-cert-file }}
        CERT_DIR: ${{ steps.tools.outputs.ssl-cert-dir }}
        BASH_ENV: ""
        ENV: ""
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
      run: |
        export PATH=/usr/bin:/bin
        skip() { echo "::warning::$1; no cycle report comment posted"; exit 0; }
        case $MAX_BYTES in '' | *[!0-9]*) MAX_BYTES=262144 ;; esac
        if [ "$MAX_BYTES" -gt 262144 ]; then MAX_BYTES=262144; fi

        if [ ! -f "$MARKDOWN" ] || [ -L "$MARKDOWN" ]; then skip "no report at $MARKDOWN"; fi
        size=$(wc -c < "$MARKDOWN")
        if [ "$size" -gt "$MAX_BYTES" ]; then skip "the report is $size bytes, over $MAX_BYTES"; fi
        if [ "$(head -n 1 "$MARKDOWN")" != '<!-- ckb-cycles-report -->' ]; then skip "the file is not a cycle report"; fi
        if [ "$(tr -d '\000' < "$MARKDOWN" | wc -c)" != "$size" ]; then skip "the report has NUL bytes"; fi
        body=$(mktemp /tmp/ckb-comment.XXXXXXXX)
        LC_ALL=C sed 's/\([@#]\)\([A-Za-z0-9_]\)/\1\xe2\x80\x8b\2/g' "$MARKDOWN" > "$body"

        cfg=$(mktemp -d /tmp/ckb-gh.XXXXXXXX)
        trap 'rm -rf "$cfg"' EXIT
        gh() {
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$cfg" GH_CONFIG_DIR="$cfg" GH_TOKEN="$GH_TOKEN" \
            GH_PROMPT_DISABLED=1 GH_NO_UPDATE_NOTIFIER=1 \
            HTTPS_PROXY="$PROXY_HTTPS" https_proxy="$PROXY_HTTPS" HTTP_PROXY="$PROXY_HTTP" http_proxy="$PROXY_HTTP" \
            NO_PROXY="$PROXY_NO" no_proxy="$PROXY_NO" SSL_CERT_FILE="$CERT_FILE" SSL_CERT_DIR="$CERT_DIR" \
            "$GH" "$@"
        }
        case $PR in *[!0-9]*) skip "pr is not a number" ;; esac
        if [ -n "$HEAD_SHA" ]; then
          if [ -z "$GH" ]; then skip "gh is not on PATH"; fi
          case $HEAD_SHA in *[!0-9a-f]*) skip "head-sha is not a commit hash" ;; esac
          if [ ${#HEAD_SHA} != 40 ]; then skip "head-sha is not a commit hash"; fi
          if [ -n "$PR" ]; then
            got=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha + " " + .base.repo.full_name + " " + .state') \
              || skip "could not read pull request $PR"
            if [ "$got" != "$HEAD_SHA $REPO open" ]; then skip "pull request $PR is not open at $HEAD_SHA (it moved on?)"; fi
          else
            case $HEAD_OWNER in '' | *[!A-Za-z0-9-]*) skip "no head repository owner to find the pull request by" ;; esac
            if [ -z "$HEAD_BRANCH" ]; then skip "no head branch to find the pull request by"; fi
            # The branch name is the PR author's: a query parameter gh encodes, never
            # part of a URL, a jq program or a command line of its own.
            prs=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f "head=$HEAD_OWNER:$HEAD_BRANCH" -f per_page=100 \
              --jq ".[] | select(.head.sha == \"$HEAD_SHA\" and .base.repo.full_name == \"$REPO\") | .number") \
              || skip "could not list the open pull requests"
            PR=${prs%%$'\n'*}
            case $PR in '' | *[!0-9]*) skip "no open pull request is at $HEAD_SHA (it moved on?)" ;; esac
            if [ "$PR" != "$prs" ]; then echo "::warning::more than one open pull request is at $HEAD_SHA; posting on $PR"; fi
          fi
        fi
        if [ -z "$PR" ]; then skip "no pull request number"; fi
        {
          echo "pr=$PR"
          echo "body=$body"
        } >> "$GITHUB_OUTPUT"

    - name: Post the sticky comment
      if: steps.check.outputs.pr != ''
      shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH: ${{ steps.tools.outputs.gh }}
        REPO: ${{ github.repository }}
        PR: ${{ steps.check.outputs.pr }}
        BODY: ${{ steps.check.outputs.body }}
        RETRY_DELAY: "5"
        PROXY_HTTPS: ${{ steps.tools.outputs.https-proxy }}
        PROXY_HTTP: ${{ steps.tools.outputs.http-proxy }}
        PROXY_NO: ${{ steps.tools.outputs.no-proxy }}
        CERT_FILE: ${{ steps.tools.outputs.ssl-cert-file }}
        CERT_DIR: ${{ steps.tools.outputs.ssl-cert-dir }}
        BASH_ENV: ""
        ENV: ""
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
      run: |
        export PATH=/usr/bin:/bin
        if [ -z "$GH" ]; then echo "::warning::gh is not on PATH; the report is in the job summary"; exit 0; fi
        case $PR in '' | *[!0-9]*) echo "::warning::no pull request number; the report is in the job summary"; exit 0 ;; esac
        if [ ! -f "$BODY" ] || [ -L "$BODY" ]; then echo "::warning::no report at $BODY; nothing to post"; exit 0; fi
        case $RETRY_DELAY in '' | *[!0-9]*) RETRY_DELAY=5 ;; esac
        # gh gets these variables and nothing else from the job, and an empty config directory.
        cfg=$(mktemp -d /tmp/ckb-gh.XXXXXXXX)
        trap 'rm -rf "$cfg"' EXIT
        gh() {
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$cfg" GH_CONFIG_DIR="$cfg" GH_TOKEN="$GH_TOKEN" \
            GH_PROMPT_DISABLED=1 GH_NO_UPDATE_NOTIFIER=1 \
            HTTPS_PROXY="$PROXY_HTTPS" https_proxy="$PROXY_HTTPS" HTTP_PROXY="$PROXY_HTTP" http_proxy="$PROXY_HTTP" \
            NO_PROXY="$PROXY_NO" no_proxy="$PROXY_NO" SSL_CERT_FILE="$CERT_FILE" SSL_CERT_DIR="$CERT_DIR" \
            "$GH" "$@"
        }
        marker='<!-- ckb-cycles-report -->'
        # Only a comment this token posted is ours to update: anyone can write one that
        # starts with the marker. The workflow token cannot read /user; it is the bot.
        login=$(gh api user --jq .login 2>/dev/null) || login='github-actions[bot]'
        # All the matches first, then the first of them: `| head` could cut gh off mid-page.
        ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq ".[] | select(.user.login == \"$login\" and (.body | startswith(\"$marker\"))) | .id") || {
          # Unknown whether ours exists: posting now could put a second one beside it.
          echo "::warning::could not list the pull request's comments; the report is in the job summary"
          exit 0
        }
        id=${ids%%$'\n'*}
        # A pull request from a fork gets a read-only token: the summary still has the table.
        if [ -z "$id" ]; then
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$BODY" >/dev/null \
            || echo "::warning::could not post the cycle report comment (read-only token?)"
          exit 0
        fi
        # Our comment exists: update it, retrying, and never post a second one beside it.
        for try in 1 2 3; do
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$BODY" >/dev/null && exit 0
          [ "$try" = 3 ] || sleep $((try * RETRY_DELAY))
        done
        echo "::warning::could not update the cycle report comment $id (read-only token?)"
