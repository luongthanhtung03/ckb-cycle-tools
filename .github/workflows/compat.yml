name: Cross-version check

# The frozen scenarios in compat/scenarios.json.br replayed under every
# ckb-debugger release in compat/debuggers.json (native Linux builds and their
# WebAssembly builds), compared group by group with the reference release.
# Weekly, and by hand; on pull requests only when the check itself changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
  pull_request:
    paths:
      - "compat/**"
      - "scripts/compat*.ts"
      - "src/replay.ts"
      - "src/wasm.ts"
      - "src/profile.ts"
      - ".github/workflows/compat.yml"

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each tarball is checked against the sha256 in compat/debuggers.json
      # (the one its release publishes) before anything is extracted.
      - name: Fetch the ckb-debugger releases
        run: npm run compat -- fetch
      # Exits 1 on any group whose cycles or result differ from the reference.
      - name: Replay every scenario under every build
        run: npm run compat -- run --out compat-out/RESULTS.md
      - name: Publish the results table
        if: always()
        run: test -f compat-out/RESULTS.md && cat compat-out/RESULTS.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compat-results
          path: compat-out/
          if-no-files-found: ignore
