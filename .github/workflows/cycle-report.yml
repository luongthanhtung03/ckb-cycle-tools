name: Cycle report

# This repository's own Action, on its own pull requests: the five session-lock
# scenarios in cycles.json replayed with the ckb-js-vm bytecode built from the
# PR and from its base, posted as one comment that each push updates.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cycle-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cycles:
    runs-on: ubuntu-latest
    # A PR whose script loops forever still ends.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's build runs in this job: leave no token in .git/config for it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: ./action
        with:
          # The base checkout has no node_modules yet; the head shares the
          # Action's own install (this repo is the Action).
          build: |
            [ -d node_modules ] || npm ci --workspaces=false --no-audit --no-fund
            npm run bench:build
          fail-above: 5
          fail-on-result-change: true
