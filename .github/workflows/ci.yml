name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a dependency or a testnet change that breaks the build shows up
  # even in a week with no commits.
  schedule:
    - cron: "17 3 * * 1"

jobs:
  test:
    # Windows is in the matrix on purpose: the debugger resolution exists
    # because the Windows toolchain behaves differently.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        # package.json says node >=20: the oldest and the newest too, on Linux.
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      # Pack, install the tarball into an empty project, use it from there.
      - run: npm run pack:check

  # Re-proves the headline claim on a clean machine: replaying a real testnet
  # transaction in ckb-debugger, group by group, adds up to exactly the cycles
  # the node reported. The CLI exits non-zero on any mismatch.
  testnet-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install ckb-debugger
        run: |
          version=v1.1.1
          url="https://github.com/nervosnetwork/ckb-standalone-debugger/releases/download/${version}/ckb-debugger_${version}_x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/ckb-debugger.tar.gz
          # The checksum v1.1.1's release publishes: a replaced asset fails here.
          echo "0dee02804af46386527c8bb94c2ee63592594ca1ec952ea42ffa9df07a9f005e  /tmp/ckb-debugger.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.ckb-tools"
          tar -xzf /tmp/ckb-debugger.tar.gz -C "$HOME/.ckb-tools"
          echo "$HOME/.ckb-tools" >> "$GITHUB_PATH"
      - name: Counter update (lock + ckb-js-vm type script)
        run: node dist/cli.js 0x64f695a23416d9a7b2d34bb7025140c90991b82e9f1dea98e103bc13a72b77ac
      - name: Script deployment (lock + built-in Type ID)
        run: node dist/cli.js 0xa21da18ff3f142127cf63d6e705d64c14577fb99a9a0cbf74f47fb70b6ad66cf
      - name: Nervos DAO withdrawal (type script reads its input's header)
        run: node dist/cli.js 0xe8776bb8eb039365be9679cd61870cdc7ea3c24e4f2164fdd5d5f103bdfa2cc5
      # A real session-lock spend, edited to pay one shannon over its limit. It was
      # never sent; the CLI must show the session lock refusing it with code 12.
      - name: Failure path (transaction not on chain)
        run: |
          set +e
          node dist/cli.js --file test/fixtures/session-lock-overspend.json | tee out.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" = 1
          grep -E "input.0.lock +exit 12 " out.txt

  # The Rust vs ckb-js-vm benchmark, rebuilt from source on a clean machine.
  # The Rust lock comes from ckb-session-kit at a pinned commit, so the numbers
  # here always refer to a known version of it. compare.mjs exits non-zero unless
  # both implementations return the expected code in every scenario.
  bench-session-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: luongthanhtung03/ckb-session-kit
          ref: 49227cd06ff14e3c2816cbaff69007a97b1d746e
          path: ckb-session-kit
      - run: rustup target add riscv64imac-unknown-none-elf
      - name: Build the Rust session lock
        working-directory: ckb-session-kit/contracts/session-lock
        run: cargo build --release
      - name: Install ckb-debugger
        run: |
          version=v1.1.1
          url="https://github.com/nervosnetwork/ckb-standalone-debugger/releases/download/${version}/ckb-debugger_${version}_x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/ckb-debugger.tar.gz
          # The checksum v1.1.1's release publishes: a replaced asset fails here.
          echo "0dee02804af46386527c8bb94c2ee63592594ca1ec952ea42ffa9df07a9f005e  /tmp/ckb-debugger.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.ckb-tools"
          tar -xzf /tmp/ckb-debugger.tar.gz -C "$HOME/.ckb-tools"
          echo "$HOME/.ckb-tools" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the ckb-js-vm session lock
        run: npm run bench:build
      - name: Run both implementations through every scenario
        env:
          SESSION_LOCK_BIN: ${{ github.workspace }}/ckb-session-kit/contracts/session-lock/target/riscv64imac-unknown-none-elf/release/session-lock
        run: node benchmarks/session-lock/compare.mjs
      - name: Publish the results table
        if: always()
        run: cat benchmarks/session-lock/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
