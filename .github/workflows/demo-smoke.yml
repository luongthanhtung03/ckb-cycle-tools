name: Demo smoke

# The live demo, checked in a real browser every day, the in-browser ckb-debugger included,, so a dead page shows up here
# before a reviewer finds it. Read-only: nothing signs or sends anything.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Demo URL to check
        default: https://ckb-cycle-tools.vercel.app
  schedule:
    - cron: "41 5 * * *"

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url || 'https://ckb-cycle-tools.vercel.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
